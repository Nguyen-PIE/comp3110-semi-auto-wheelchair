[pytest]
# Warnings from code the project downloads, not its own:
#   SocNavGym (third_party/SocNavGym) loads its reward file with load_module(), which Python 3.12
#   drops. It works on 3.11, the version setup.sh installs.
#   Trajectron++ (third_party/Trajectron-plus-plus, the learned walkers) makes its GMM2D distribution
#   without arg_constraints, which PyTorch asks for. Its sampling is the same either way.
filterwarnings =
    ignore:the load_module\(\) method is deprecated:DeprecationWarning
    ignore:.*GMM2D.* does not define `arg_constraints`:UserWarning

# Only the project's own tests (not the ones in third_party/)
testpaths = tests
